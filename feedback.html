<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Feedback Form</title></head>
<body><h2>Submit Your Feedback</h2>
<form action="submitFeedback" method="post">
<label>Name: <input type="text" name="name" required></label><br><br>
<label>Email: <input type="email" name="email" required></label><br><br>
<label>Feedback Type: <select name="feedbackType"><option>Complaint</option><option>Suggestion</option><option>Compliment</option></select></label><br><br>
<label>Comments:<br><textarea name="comments" rows="5" cols="40" required></textarea></label><br><br>
<button type="submit">Submit Feedback</button>
</form></body></html>
